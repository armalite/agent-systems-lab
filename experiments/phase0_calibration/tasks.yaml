id: phase0_calibration_tasks_v1
version: "1.0.0"

# FROZEN Phase 0 calibration task set. Bound by research/preregistration/PHASE0.md.
# Once the pre-registration is committed, this file is immutable for that execution; a change
# constitutes a new explicitly versioned design (SPEC.md s16, v2.5).
#
# 28 tasks, two pre-declared strata, 28 distinct fixture records, zero record reuse:
#
#   exposure: direct     20 customer-ID lookups - the headline stratum. The overlap condition
#                        adds five competing customer tools, so these are directly targeted.
#   exposure: non_target  8 order/invoice/product/employee lookups. Their expected tool gains no
#                        new direct competitor; only the tool list grows. Reported separately as
#                        a coarse spillover indicator - NOT a true negative control, and never
#                        pooled into the headline.
#
# Every customer task keys on customer_id by construction: a task keyed on name or email would
# make an overlap-only tool correct and would be unanswerable in baseline, breaking the pairing.
# `exact_match` is deliberately unused - M3 showed a conversational model answers in prose.

tasks:
  - id: p0_c01_c101_email
    prompt: "What is the email address of customer C101?"
    expected:
      tool: get_customer
      arguments: {customer_id: C101}
      answer: {email: "m.delgado@example.test"}
    answer_strategy: contains_facts
    metadata: {exposure: direct, entity: customer, field: email, register: direct}

  - id: p0_c02_c102_city
    prompt: "Look up customer C102 and tell me which city they are based in."
    expected:
      tool: get_customer
      arguments: {customer_id: C102}
      answer: {city: "Auckland"}
    answer_strategy: contains_facts
    metadata: {exposure: direct, entity: customer, field: city, register: imperative}

  - id: p0_c03_c103_status
    prompt: "I need the current account status for customer C103."
    expected:
      tool: get_customer
      arguments: {customer_id: C103}
      answer: {status: "churned"}
    answer_strategy: contains_facts
    metadata: {exposure: direct, entity: customer, field: status, register: stated_need}

