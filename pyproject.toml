[project]
name = "agent-lab"
version = "0.0.0"
description = "Agent Systems Lab - an experimental instrument for studying evolving LLM agent systems"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # Kept deliberately minimal. Dependencies are added by the milestone that first
    # uses them (see AGENTS.md s6), not because they appear in SPEC.md s7.
    "typer>=0.12",
]

[project.scripts]
agent-lab = "agent_lab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Python only. Recent ruff versions also format code blocks inside Markdown, which would
# rewrite the illustrative snippets in SPEC.md - an authoritative document that tooling
# must not touch.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Paid provider tests are opt-in by construction: they are deselected unless a run
# explicitly asks for them with `-m paid`. Default `pytest` never spends money.
addopts = "--strict-markers -m 'not paid'"
markers = [
    "paid: test performs a real, billable model-provider API call (deselected by default)",
]
